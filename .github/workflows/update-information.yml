name: Update Dhamari information

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-information
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Search configured public sources
        run: npm run update:information
      - name: Test automation and site build
        run: |
          npm run test:automation
          npm run build
      - name: Restrict automation output
        run: |
          changed="$(git diff --name-only)"
          test -z "$changed" || test "$changed" = "src/data/internetUpdates.json"
      - name: Publish changed candidate feed
        run: |
          git add src/data/internetUpdates.json
          if git diff --cached --quiet; then
            echo "No new information found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh Dhamari news candidates"
          git pull --rebase origin main
          git push origin HEAD:main
