name: Propose reviewed information updates

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-information
  cancel-in-progress: true

jobs:
  propose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Search configured public sources
        run: npm run update:information
      - name: Restrict automation output
        run: |
          changed="$(git diff --name-only)"
          test -z "$changed" || test "$changed" = "src/data/internetUpdates.json"
      - name: Open or update review pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: automation/information-review
          delete-branch: true
          commit-message: "chore: refresh information review candidates"
          title: "Review: Dhamari information candidates"
          body: |
            Automated search candidates only. Every result is **पडताळणी प्रलंबित**.
            Merge does not publish these as factual claims; an editor must review sources first.
            Before merging, the editor must:
            - verify that the location is Dhamari in Shirur, Pune;
            - open every source;
            - verify each publication date and publisher;
            - remove irrelevant results; and
            - merge only suitable references.
          add-paths: src/data/internetUpdates.json
